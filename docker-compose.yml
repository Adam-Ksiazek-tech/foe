name: foe-tracker

services:
  foe:
    image: node:22-alpine
    container_name: foe # <- nazwa widoczna w docker ps
    working_dir: /app
    ports:
      # Port hosta ustawiasz w .env (APP_PORT) - domyślnie 3418,
      # żeby nie kolidować z innymi projektami (3417 zajęte przez lotto)
      - "${APP_PORT:-3418}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    volumes:
      # Kod montujemy z hosta (żywa edycja + hot reload)
      - .:/app
      # ...ale node_modules i .next trzymamy w wolumenach kontenera,
      # a nie na hoście - dzięki temu na hoście NIE POJAWI SIĘ node_modules
      # i nie trzeba mieć npm/node zainstalowanego lokalnie
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: sh -c "npm install && npm run dev"

volumes:
  node_modules:
  next_cache:
